<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 - Page Not Found | ERRERlabs</title>
  <meta name="description" content="The page you're looking for doesn't exist or has been moved.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #030108;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 500px;
      text-align: center;
    }

    .error-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(80px, 20vw, 120px);
      font-weight: 700;
      background: linear-gradient(135deg, #ff7d41 0%, #f5c518 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 32px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 12px;
      transition: all 0.3s ease;
      background: linear-gradient(135deg, #ff7d41 0%, #ff5a28 100%);
      color: #fff;
      box-shadow: 0 4px 24px rgba(255, 125, 65, 0.35);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(255, 125, 65, 0.45);
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }

    .footer-links {
      margin-top: 48px;
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .footer-links a {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
      text-decoration: none;
      transition: color 0.3s;
    }

    .footer-links a:hover {
      color: #fff;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.3);
      margin-bottom: 32px;
    }

    .logo-check {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      background: linear-gradient(135deg, #50c878, #3da862);
      border-radius: 4px;
      font-size: 10px;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <span class="logo-check">&#10003;</span>
      ERRERlabs
    </div>
    <div class="error-code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Maybe the URL is wrong, or it was architecturally removed.</p>
    <a href="/" class="btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Back to home
    </a>
    <div class="footer-links">
      <a href="/#problem">Why It Matters</a>
      <a href="/#errer">The Check</a>
      <a href="/#research">Research</a>
      <a href="https://github.com/kmay89/securaCV" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </div>
</body>
</html>
